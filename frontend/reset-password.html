<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    ✓
                </div>

                <div>
                    <h1>Task Manager</h1>

                    <p>
                        Reset your password
                    </p>
                </div>

            </div>

        </header>


        <section id="authSection">

            <div class="auth-box">

                <h2>
                    Reset Password
                </h2>

                <p>
                    Enter your new password
                </p>


                <input type="password" id="newPassword" placeholder="New password">


                <input type="password" id="confirmPassword" placeholder="Confirm password">


                <button id="resetBtn">
                    Reset Password
                </button>


                <p id="resetMessage" style="margin-top:15px;"></p>

            </div>

        </section>

    </div>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const token =
            params.get("token");


        const resetBtn =
            document.getElementById(
                "resetBtn"
            );

        const message =
            document.getElementById(
                "resetMessage"
            );


        resetBtn.addEventListener(
            "click",
            async () => {

                const password =
                    document.getElementById(
                        "newPassword"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (!token) {

                    message.textContent =
                        "Invalid reset link.";

                    return;
                }


                if (!password || !confirmPassword) {

                    message.textContent =
                        "Please fill both fields.";

                    return;
                }


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            `/auth/reset-password/${token}`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    message.textContent =
                        data.message;


                    if (response.ok) {

                        resetBtn.disabled = true;

                        setTimeout(() => {

                            window.location.href =
                                "/";

                        }, 2000);

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

</body>

</html>
